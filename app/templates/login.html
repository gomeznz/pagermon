{% extends "base.html" %}
{% block title %}Sign in · MultipagePlus{% endblock %}
{% block main_class %}page narrow login{% endblock %}
{% block content %}
<div class="card">
  <h1><span class="brand-mark" aria-hidden="true"></span><span class="wordmark">Multipage<span class="plus">Plus</span></span></h1>
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input name="username" autocomplete="username" autocapitalize="none" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="primary">Sign in</button>
  </form>
</div>
{% endblock %}
